[project]
name = "subsyncr"
version = "0.1.0"
description = "A cross-platform batch queue for subtitle synchronization"
readme = "README.md"
authors = [
    { name = "jessielw", email = "jessielw4049@gmail.com" },
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "autosubsync>=1.0,<2",
    "charset-normalizer>=3.4,<4",
    "ffsubsync>=0.5.1,<0.6",
    "platformdirs>=4.3,<5",
    "pyside6-essentials>=6.8,<7",
    "pysubs2>=1.7,<2",
    "qtawesome>=1.4,<2",
    "rapidfuzz>=3.14,<4",
]

[project.scripts]
subsyncr = "subsyncr.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "pytest>=8.4",
    "pytest-cov>=7",
    "pytest-qt>=4.5",
    "pytest-timeout>=2.4",
    "ruff>=0.12",
]
build = [
    "pyinstaller>=6.15",
    "pyinstaller-hooks-contrib>=2025.8",
    "setuptools>=78.1.1,<82",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "build.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.basedpyright]
include = ["src", "tests", "build.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--timeout=120"]
timeout_method = "thread"
markers = [
    "slow: exercises a real ffsubsync subprocess",
]

