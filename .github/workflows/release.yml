name: Release

# A version tag (0.1.0, v0.1.0, 0.1.0-dev.1, ...) builds every platform and
# opens a *draft* release with the archives attached, so nothing is public
# until it has been looked at. Tags with a pre-release suffix are drafted as
# pre-releases. A manual run
# builds the same archives as workflow artifacts and publishes nothing, which
# is how to dry-run this file.
on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          # The oldest supported image, so the bundled libraries are linked
          # against an older glibc and the build runs on more distributions.
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install Python
        run: uv python install 3.12

      # PySide6 loads libEGL and the xkb/xcb libraries even on the offscreen
      # platform, and PyInstaller has to find them to bundle the Qt plugins.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Install dependencies
        run: uv sync --frozen --group dev --group build

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Formatting
        run: uv run --no-sync ruff format --check .

      - name: Types
        run: uv run --no-sync basedpyright

      - name: Test (including real worker processes)
        run: uv run --no-sync pytest

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version=$(uv run --no-sync python -c "import subsyncr; print(subsyncr.__version__)")
          # A tag that disagrees with the code would ship an About box and
          # log header claiming a different release than the download.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "archive=SubSyncr-$version-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv run --frozen --group build python build.py

      # build.py runs the real frozen sync on every platform, including the
      # Windows windowed executable and Contents/MacOS inside the shipped app.

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -Path dist/SubSyncr
          -DestinationPath "${{ steps.version.outputs.archive }}.zip"

      # tar keeps the executable bit, which a zip made here would lose.
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ steps.version.outputs.archive }}.tar.gz" -C dist SubSyncr

      # ditto rather than zip: the .app holds framework symlinks that a plain
      # zip -r would flatten into copies, breaking the Qt frameworks.
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: >-
          ditto -c -k --sequesterRsrc --keepParent dist/SubSyncr.app
          "${{ steps.version.outputs.archive }}.zip"

      - name: Verify archived app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          extracted=$(mktemp -d "$RUNNER_TEMP/subsyncr-archive.XXXXXX")
          ditto -x -k "${{ steps.version.outputs.archive }}.zip" "$extracted"
          app="$extracted/SubSyncr.app"
          /usr/bin/codesign --verify --all-architectures --deep --strict --verbose=2 "$app"
          /usr/bin/codesign --display --verbose=4 "$app"
          uv run --no-sync python packaging/smoke_test.py "$app/Contents/MacOS/SubSyncr"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.version.outputs.archive }}
          path: ${{ steps.version.outputs.archive }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Anything after X.Y.Z (-dev.1, rc1, ...) marks a pre-release.
      - name: Detect pre-release
        id: kind
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum SubSyncr-* > SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          draft: true
          prerelease: ${{ steps.kind.outputs.prerelease }}
          name: SubSyncr ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
